<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacking Command Cheat Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #050b14;
  --bg2:    #080f1c;
  --bg3:    #0c1628;
  --border: #1a2a40;
  --text:   #c8d8e8;
  --muted:  #4a6080;
  --green:  #00ff88;
  --cyan:   #00d4ff;
  --yellow: #ffd700;
  --red:    #ff4444;
  --purple: #bf7fff;
  --orange: #ff8c00;
  --mono:   'JetBrains Mono', monospace;
  --body:   'Hind Siliguri', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  min-height: 100vh;
}

/* SCANLINE EFFECT */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,255,136,0.015) 2px, rgba(0,255,136,0.015) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* HEADER */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 2px;
  white-space: nowrap;
}
.logo .bracket { color: var(--muted); }
.logo .blink {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--green);
  margin-left: 4px;
  animation: blink 1s step-end infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.search-wrap {
  flex: 1;
  position: relative;
  max-width: 500px;
}
.search-wrap .icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
}
#searchInput {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px 9px 36px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
#searchInput:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(0,255,136,0.1); }
#searchInput::placeholder { color: var(--muted); }

.count-badge {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.count-badge span { color: var(--green); font-weight: 700; }

/* LAYOUT */
.layout {
  display: flex;
  height: calc(100vh - 57px);
}

/* SIDEBAR */
.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  padding: 6px 16px;
  text-transform: uppercase;
}

.cat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 16px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  text-align: left;
  transition: all 0.15s;
  border-left: 2px solid transparent;
}
.cat-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.cat-btn.active {
  color: var(--green);
  background: rgba(0,255,136,0.06);
  border-left-color: var(--green);
}
.cat-btn .cat-icon { font-size: 14px; }
.cat-count {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg3);
  padding: 1px 6px;
  border-radius: 10px;
  color: var(--muted);
}
.cat-btn.active .cat-count { background: rgba(0,255,136,0.15); color: var(--green); }

/* MAIN */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* SECTION */
.section { margin-bottom: 28px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-icon { font-size: 18px; }
.section-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 1px;
}
.section-desc {
  font-size: 12px;
  color: var(--muted);
  margin-left: auto;
  font-family: var(--mono);
}

/* COMMAND GRID */
.cmd-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 10px;
}

/* COMMAND CARD */
.cmd-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
}
.cmd-card:hover {
  border-color: rgba(0,255,136,0.3);
  transform: translateY(-1px);
}
.cmd-card.hidden { display: none; }

.cmd-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
}
.cmd-dots { display: flex; gap: 5px; }
.cmd-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.cmd-dots span:nth-child(1) { background: #ff5f57; }
.cmd-dots span:nth-child(2) { background: #febc2e; }
.cmd-dots span:nth-child(3) { background: #28c840; }
.cmd-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  flex: 1;
}
.cmd-tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 600;
}

.cmd-body { padding: 10px 12px; }
.cmd-desc {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 8px;
  line-height: 1.5;
}

.cmd-code {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.8;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.cmd-code:hover { background: #07111e; }
.cmd-code:hover .copy-hint { opacity: 1; }

.copy-hint {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.2s;
  background: var(--bg2);
  padding: 2px 6px;
  border-radius: 3px;
}

.cmd-code.copied { border-color: var(--green); background: rgba(0,255,136,0.05); }
.cmd-code.copied .copy-hint { opacity: 1; color: var(--green); }

/* Syntax colors */
.s-cmd  { color: var(--cyan); }
.s-flag { color: var(--yellow); }
.s-val  { color: var(--green); }
.s-com  { color: var(--muted); font-style: italic; }
.s-var  { color: var(--orange); }
.s-str  { color: #a6e3a1; }
.s-red  { color: var(--red); }
.s-pur  { color: var(--purple); }
.s-prompt { color: var(--muted); }

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  font-family: var(--mono);
}
.empty .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty .empty-text { font-size: 14px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--green);
  color: var(--bg);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 6px;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  z-index: 9000;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* NO RESULT */
.no-result { display: none; text-align: center; padding: 60px; color: var(--muted); font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="bracket">[</span>HACK<span class="bracket">]</span>
    <span style="color:var(--muted);">~$</span>
    <span class="blink"></span>
  </div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="command খোঁজো... (nmap, sqlmap, burp...)" autocomplete="off">
  </div>
  <div class="count-badge"><span id="visibleCount">0</span> commands</div>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-title">Categories</div>
    <button class="cat-btn active" data-cat="all" onclick="filterCat(this)">
      <span class="cat-icon">⚡</span> All
      <span class="cat-count" id="cnt-all">0</span>
    </button>
    <button class="cat-btn" data-cat="recon" onclick="filterCat(this)">
      <span class="cat-icon">🔭</span> Recon
      <span class="cat-count" id="cnt-recon">0</span>
    </button>
    <button class="cat-btn" data-cat="scan" onclick="filterCat(this)">
      <span class="cat-icon">🗺️</span> Scanning
      <span class="cat-count" id="cnt-scan">0</span>
    </button>
    <button class="cat-btn" data-cat="web" onclick="filterCat(this)">
      <span class="cat-icon">🌐</span> Web Enum
      <span class="cat-count" id="cnt-web">0</span>
    </button>
    <button class="cat-btn" data-cat="exploit" onclick="filterCat(this)">
      <span class="cat-icon">💥</span> Exploit
      <span class="cat-count" id="cnt-exploit">0</span>
    </button>
    <button class="cat-btn" data-cat="wifi" onclick="filterCat(this)">
      <span class="cat-icon">📶</span> WiFi
      <span class="cat-count" id="cnt-wifi">0</span>
    </button>
    <button class="cat-btn" data-cat="post" onclick="filterCat(this)">
      <span class="cat-icon">🏴</span> Post-Exploit
      <span class="cat-count" id="cnt-post">0</span>
    </button>
    <button class="cat-btn" data-cat="network" onclick="filterCat(this)">
      <span class="cat-icon">📡</span> Network
      <span class="cat-count" id="cnt-network">0</span>
    </button>
    <button class="cat-btn" data-cat="crack" onclick="filterCat(this)">
      <span class="cat-icon">🔨</span> Cracking
      <span class="cat-count" id="cnt-crack">0</span>
    </button>
    <button class="cat-btn" data-cat="misc" onclick="filterCat(this)">
      <span class="cat-icon">🔧</span> Misc
      <span class="cat-count" id="cnt-misc">0</span>
    </button>
  </nav>

  <main class="main" id="mainContent">
    <!-- Injected by JS -->
  </main>
</div>

<div class="toast" id="toast">✓ Copied!</div>

<script>
const COMMANDS = [

    code: '<span class="s-cmd">shodan</span> search <span class="s-str">"hostname:target.com"</span>\n<span class="s-cmd">shodan</span> host <span class="s-var">93.184.216.34</span>',
    raw: 'shodan search "hostname:target.com"\nshodan host 93.184.216.34'
  },
  {
    cat: 'misc', section: 'Misc Tools', sIcon: '🔧',
    label: 'proxychains', tag: 'PROXY', tagColor: '#10b981',
    desc: 'যেকোনো command Proxy দিয়ে চালাও',
    code: '<span class="s-cmd">proxychains</span> nmap <span class="s-flag">-sT</span> target.com\n<span class="s-cmd">proxychains</span> curl ifconfig.me\n<span class="s-cmd">proxychains</span> sqlmap <span class="s-flag">-u</span> <span class="s-str">"http://target.com?id=1"</span>',
    raw: 'proxychains nmap -sT target.com'
  },
];

// ═══ BUILD UI ═══
let currentCat = 'all';
let currentSearch = '';

function getSections() {
  const sections = {};
  COMMANDS.forEach(cmd => {
    const key = cmd.section;
    if (!sections[key]) sections[key] = { icon: cmd.sIcon, cmds: [] };
    sections[key].cmds.push(cmd);
  });
  return sections;
}

function buildUI() {
  const main = document.getElementById('mainContent');
  const sections = getSections();
  let html = '';

  for (const [sName, sData] of Object.entries(sections)) {
    const catCmds = sData.cmds.filter(c => c.cat === currentCat || currentCat === 'all');
    if (catCmds.length === 0) continue;

    html += `<div class="section" data-section="${sName}">
      <div class="section-header">
        <span class="section-icon">${sData.icon}</span>
        <span class="section-title">${sName.toUpperCase()}</span>
        <span class="section-desc">${catCmds.length} commands</span>
      </div>
      <div class="cmd-grid">`;

    catCmds.forEach((cmd, i) => {
      html += `<div class="cmd-card" data-cat="${cmd.cat}" data-label="${cmd.label.toLowerCase()}" data-desc="${cmd.desc.toLowerCase()}" data-raw="${cmd.raw.toLowerCase()}">
        <div class="cmd-header">
          <div class="cmd-dots"><span></span><span></span><span></span></div>
          <span class="cmd-label">${cmd.label}</span>
          <span class="cmd-tag" style="background:${cmd.tagColor}22;color:${cmd.tagColor};border:1px solid ${cmd.tagColor}44">${cmd.tag}</span>
        </div>
        <div class="cmd-body">
          <div class="cmd-desc">${cmd.desc}</div>
          <div class="cmd-code" onclick="copyCmd(this, \`${cmd.raw.replace(/`/g,'\\`')}\`)">
            <span class="copy-hint">click to copy</span>
            ${cmd.code}
          </div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  }

  main.innerHTML = html || '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No commands found</div></div>';
  updateCounts();
  applySearch();
}

function updateCounts() {
  const cats = ['recon','scan','web','exploit','wifi','post','network','crack','misc'];
  cats.forEach(cat => {
    const count = COMMANDS.filter(c => c.cat === cat).length;
    const el = document.getElementById('cnt-'+cat);
    if (el) el.textContent = count;
  });
  document.getElementById('cnt-all').textContent = COMMANDS.length;
}

function filterCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  buildUI();
}

function applySearch() {
  const q = currentSearch.toLowerCase().trim();
  const cards = document.querySelectorAll('.cmd-card');
  let visible = 0;

  cards.forEach(card => {
    const label = card.dataset.label || '';
    const desc  = card.dataset.desc  || '';
    const raw   = card.dataset.raw   || '';
    const matches = !q || label.includes(q) || desc.includes(q) || raw.includes(q);
    card.style.display = matches ? '' : 'none';
    if (matches) visible++;
  });

  // Hide empty sections
  document.querySelectorAll('.section').forEach(sec => {
    const visCards = [...sec.querySelectorAll('.cmd-card')].some(c => c.style.display !== 'none');
    sec.style.display = visCards ? '' : 'none';
  });

  document.getElementById('visibleCount').textContent = visible;
}

function copyCmd(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    el.querySelector('.copy-hint').textContent = '✓ Copied!';
    setTimeout(() => {
      el.classList.remove('copied');
      el.querySelector('.copy-hint').textContent = 'click to copy';
    }, 2000);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentSearch = this.value;
  applySearch();
});

// INIT
buildUI();
updateCounts();
document.getElementById('visibleCount').textContent = COMMANDS.length;
</script>
</body>
</html>
